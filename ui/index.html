<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tansu · Kisekae presets</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👘</text></svg>">
  <link rel="stylesheet" href="/kisekae/static/tansu.css">
  <script>
    // Theme before first paint: saved choice, else the system's.
    try {
      const t = localStorage.getItem("tansu.theme");
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    } catch { document.documentElement.dataset.theme = "dark"; }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/kisekae" title="Tansu: Kisekae preset organizer"><span class="logo">👘</span> Tansu</a>
    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="search" type="search" placeholder="Search names, tags, field values, LoRAs…" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <select id="sort" title="Sort">
      <option value="name">Path A–Z</option>
      <option value="title">Name A–Z</option>
      <option value="mtime">Recently changed</option>
    </select>
    <div class="spacer"></div>
    <button id="new" class="btn primary" disabled title="The editor arrives in the next build step">＋ New preset</button>
    <button id="refresh" class="btn icon" title="Reload the library">⟳</button>
    <button id="blur" class="btn icon" title="Blur previews rated above PG-13"></button>
    <button id="theme" class="btn icon" title="Light / dark">◐</button>
  </header>
  <div class="layout">
    <nav id="tree" class="sidebar" aria-label="Folders"></nav>
    <main>
      <div id="filters" class="filters"></div>
      <div id="status" class="status"></div>
      <div id="grid" class="grid"></div>
    </main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/kisekae/static/app.js"></script>
</body>
</html>
